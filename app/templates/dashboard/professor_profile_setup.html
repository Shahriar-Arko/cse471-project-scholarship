{% extends "base.html" %}
{% block title %}Complete Profile - ScholarMatch{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#0B1120] text-slate-100 flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="absolute top-0 right-0 w-[40rem] h-[40rem] bg-amber-500/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="max-w-3xl w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl z-10">
        <div class="text-center mb-8 border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-extrabold text-white mb-2">Complete Your Academic Profile 🎓</h1>
            <p class="text-slate-400">To connect you with prospective students, we need a few more details about your research and institution.</p>
        </div>

        <form action="{{ url_for('professor.setup_profile') }}" method="POST" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Institution -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">University / Institution</label>
                    <input type="text" name="institution" required placeholder="e.g. Stanford University" value="{{ '' if prof.institution == 'Pending Configuration' else prof.institution }}" class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </div>

                <!-- Department -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Department</label>
                    <input type="text" name="department" required placeholder="e.g. Computer Science" value="{{ '' if prof.department == 'Pending Configuration' else prof.department }}" class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </div>

                <!-- Country -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Country</label>
                    <input type="text" name="country" required placeholder="e.g. United States" value="{{ '' if prof.country == 'Not Specified' else prof.country }}" class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </div>

                <!-- Primary Domain -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Primary Research Domain</label>
                    <input type="text" name="primary_domain" required placeholder="e.g. Artificial Intelligence" value="{{ '' if prof.primary_domain == 'Not Specified' else prof.primary_domain }}" class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <!-- Lab Info -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Lab Name (Optional)</label>
                    <input type="text" name="lab_name" placeholder="e.g. Decentralized AI Lab" value="{{ prof.lab_name or '' }}" class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">
                </div>
            </div>

            <!-- Bio Summary -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Brief Bio / Research Summary</label>
                <textarea name="bio_summary" rows="3" placeholder="Briefly describe your research focus..." class="w-full bg-black/40 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-amber-500 focus:outline-none">{{ prof.bio_summary or '' }}</textarea>
            </div>

            <!-- Toggles -->
            <div class="flex flex-col sm:flex-row gap-6 pt-4 border-t border-slate-800">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="accepting_students" class="w-5 h-5 rounded border-slate-700 text-amber-500 focus:ring-amber-500" {% if prof.accepting_students %}checked{% endif %}>
                    <span class="text-sm font-semibold text-slate-300">Actively Accepting MS/PhD Students</span>
                </label>

                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="has_funding" class="w-5 h-5 rounded border-slate-700 text-amber-500 focus:ring-amber-500" {% if prof.has_funding %}checked{% endif %}>
                    <span class="text-sm font-semibold text-slate-300">RA/TA Funding Available</span>
                </label>
            </div>

            <button type="submit" class="w-full py-4 mt-6 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-bold shadow-lg shadow-amber-500/20 transition-all">
                Save Profile & Enter Dashboard →
            </button>
        </form>
    </div>
</div>
{% endblock %}
