<!-- GLOBAL AI CHAT WIDGET -->
<div id="ai-chat-widget" class="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
    
    <!-- Chat Window (Hidden by default) -->
    <div id="ai-chat-window" class="hidden w-80 sm:w-96 bg-[#0B1120] border border-slate-700/50 shadow-2xl shadow-indigo-500/20 rounded-2xl mb-4 overflow-hidden flex flex-col transition-all transform origin-bottom-right duration-300 relative">
        
        <!-- Glowing Edge Effect -->
        <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-indigo-500/50 to-transparent"></div>

        <!-- Header -->
        <div class="bg-slate-900/80 backdrop-blur-md p-4 flex justify-between items-center border-b border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white border border-indigo-400/30 shadow-lg shadow-indigo-500/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h3 class="text-white font-bold text-sm tracking-wide">ScholarMatch AI</h3>
                    <p class="text-indigo-400 text-xs font-semibold">RAG Engine Online</p>
                </div>
            </div>
            <button aria-label="Close AI Chat" onclick="toggleChat()" class="text-slate-400 hover:text-white transition-colors bg-slate-800/50 p-1.5 rounded-lg hover:bg-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Messages Area -->
        <div id="ai-chat-messages" class="h-[350px] overflow-y-auto p-4 space-y-4 bg-[#0B1120]/90 flex flex-col scrollbar-thin scrollbar-thumb-slate-700 scrollbar-track-transparent">
            <!-- Initial Greeting -->
            <div class="flex gap-2">
                <div class="w-7 h-7 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-xs flex-shrink-0 mt-1">🤖</div>
                <div class="bg-slate-800/60 backdrop-blur-sm text-slate-200 text-sm p-3.5 rounded-2xl rounded-tl-none border border-slate-700 shadow-sm leading-relaxed">
                    Hi {{ current_user.full_name or 'there' }}! 👋 I am your AI Assistant. I can search our database for universities, scholarships, and application requirements. What are you looking for today?
                </div>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="p-3 bg-slate-900/90 backdrop-blur-md border-t border-slate-800">
            <form id="ai-chat-form" class="flex gap-2 items-center" onsubmit="sendChatMessage(event)">
                <input type="text" id="ai-chat-input" placeholder="Ask about scholarships..." class="flex-grow bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all placeholder-slate-500" required>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl transition-all shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-105 disabled:opacity-50 disabled:hover:scale-100" id="ai-chat-submit">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button aria-label="Open AI Chat Window" onclick="toggleChat()" class="w-14 h-14 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center text-white ...">        
        
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        <span class="absolute top-0 right-0 w-3 h-3 bg-rose-500 border-2 border-[#0B1120] rounded-full animate-pulse transform translate-x-1 -translate-y-1"></span>
    </button>
</div>

<!-- AJAX STREAMING SCRIPT -->
<script>
    function toggleChat() {
        const window = document.getElementById('ai-chat-window');
        if (window.classList.contains('hidden')) {
            window.classList.remove('hidden');
            window.classList.add('flex');
            setTimeout(() => document.getElementById('ai-chat-input').focus(), 100);
        } else {
            window.classList.add('hidden');
            window.classList.remove('flex');
        }
    }

    async function sendChatMessage(e) {
        e.preventDefault();
        const input = document.getElementById('ai-chat-input');
        const submitBtn = document.getElementById('ai-chat-submit');
        const messagesDiv = document.getElementById('ai-chat-messages');
        const message = input.value.trim();
        if (!message) return;

        messagesDiv.innerHTML += `
            <div class="flex gap-2 justify-end animate-[fadeIn_0.3s_ease-out]">
                <div class="bg-indigo-600 text-white text-sm p-3.5 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] leading-relaxed">
                    ${message}
                </div>
            </div>
        `;
        
        input.value = '';
        input.disabled = true;
        submitBtn.disabled = true;
        
        // Instant empty bubble for AI response
        const msgId = 'msg-' + Date.now();
        messagesDiv.innerHTML += `
            <div class="flex gap-2 animate-[fadeIn_0.3s_ease-out]">
                <div class="w-7 h-7 rounded-full bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-xs flex-shrink-0 mt-1">🤖</div>
                <div id="${msgId}" class="bg-slate-800/60 backdrop-blur-sm text-slate-200 text-sm p-3.5 rounded-2xl rounded-tl-none border border-slate-700 shadow-sm max-w-[85%] leading-relaxed min-h-[44px]">
                    <span class="animate-pulse text-indigo-400 font-semibold">Connecting...</span>
                </div>
            </div>
        `;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        const aiMessageDiv = document.getElementById(msgId);

        try {
            const response = await fetch("{{ url_for('student.chat_api') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            if (!response.ok) {
                // If Python threw a 500 error, read it as text
                const errText = await response.text();
                aiMessageDiv.innerHTML = `<span class="text-rose-400">${errText}</span>`;
            } else {
                // Read the Stream successfully!
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";
                aiMessageDiv.innerHTML = ""; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break; 
                    
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    
                    aiMessageDiv.innerHTML = fullText
                        .replace(/\*\*(.*?)\*\*/g, '<span class="font-bold text-white">$1</span>')
                        .replace(/\n/g, '<br>');
                    
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }
        } catch (err) {
            aiMessageDiv.innerHTML = `<span class="text-rose-400">Stream crashed: ${err.message}. Check terminal!</span>`;
        }
        
        input.disabled = false;
        submitBtn.disabled = false;
        input.focus();
    }
</script>

<style>
    @keyframes shimmer {
        100% { transform: translateX(100%); }
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
