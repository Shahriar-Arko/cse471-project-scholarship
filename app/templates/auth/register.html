{% extends "base.html" %}
{% block title %}Register - ScholarMatch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center animated-bg relative overflow-hidden py-12 px-4">
    
    <!-- Floating Orbs -->
    <div class="absolute top-10 right-20 w-80 h-80 bg-blue-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
    <div class="absolute bottom-10 left-20 w-80 h-80 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
    
    <div class="relative w-full max-w-xl animate-fade-in" x-data="{ role: 'student', password: '', checkStrength() { 
        let score = 0;
        if(this.password.length > 7) score++;
        if(/[A-Z]/.test(this.password)) score++;
        if(/[0-9]/.test(this.password)) score++;
        if(/[^A-Za-z0-9]/.test(this.password)) score++;
        return score;
    } }">
        <div class="glass-card rounded-2xl shadow-2xl p-8 relative overflow-hidden">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-white tracking-tight">Create an Account</h1>
                <p class="text-indigo-100 mt-1 text-sm">Join the global academic network</p>
            </div>

            <!-- FIXED: Role Toggle Switch (3 Columns) -->
            <div class="flex p-1 bg-white/10 rounded-xl mb-8 relative backdrop-blur-md">
                <button type="button" @click="role = 'student'"
                    class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                    :class="role === 'student' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                    Student
                </button>
                <button type="button" @click="role = 'professor'"
                    class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                    :class="role === 'professor' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                    Professor
                </button>
                <button type="button" @click="role = 'evaluator'"
                    class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                    :class="role === 'evaluator' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                    Evaluator
                </button>
                
                <!-- Sliding background pill -->
                <div class="absolute top-1 bottom-1 w-[calc(33.33%-4px)] bg-white rounded-lg transition-all duration-300 ease-in-out"
                    :class="{
                        'left-1': role === 'student',
                        'left-[calc(33.33%+2px)]': role === 'professor',
                        'left-[calc(66.66%+2px)]': role === 'evaluator'
                    }"></div>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
                <input type="hidden" name="role" :value="role">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Common Fields -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-white/90 mb-1">Full Name</label>
                        <input type="text" name="full_name" required class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="John Doe">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-white/90 mb-1">Email Address</label>
                        <input type="email" name="email" required class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="john@example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-white/90 mb-1">Password</label>
                        <input type="password" name="password" x-model="password" required class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="••••••••">
                        
                        <!-- Password Strength Indicator -->
                        <div class="mt-2 h-1.5 w-full bg-white/10 rounded-full overflow-hidden flex gap-1">
                            <div class="h-full transition-all duration-300" :class="{'w-1/3 bg-red-400': checkStrength() > 0, 'w-0': checkStrength() === 0}"></div>
                            <div class="h-full transition-all duration-300" :class="{'w-1/3 bg-yellow-400': checkStrength() > 1, 'w-0': checkStrength() <= 1}"></div>
                            <div class="h-full transition-all duration-300" :class="{'w-1/3 bg-green-400': checkStrength() > 2, 'w-0': checkStrength() <= 2}"></div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-white/90 mb-1">Confirm Password</label>
                        <input type="password" name="confirm_password" required class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="••••••••">
                    </div>
                </div>
                
                <!-- Professor specific fields (animated reveal) -->
                <div x-show="role === 'professor'" x-collapse x-cloak class="space-y-4 pt-2">
                    <div class="h-px w-full bg-white/20 my-2"></div>
                    <p class="text-xs text-indigo-100 mb-2">Professional Details (Required for Professors)</p>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-white/90 mb-1">Institution / University</label>
                        <input type="text" name="institution" class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="e.g. Harvard University">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-white/90 mb-1">Department</label>
                            <input type="text" name="department" class="block w-full px-3 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50" placeholder="e.g. Computer Science">
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-2.5 px-4 bg-white text-indigo-600 font-semibold rounded-xl shadow-lg hover:bg-indigo-50 hover:scale-[1.02] hover:shadow-xl transition-all duration-300">
                        Create Account
                    </button>
                </div>
            </form>
            <p class="mt-6 text-center text-sm text-indigo-100">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="text-white font-semibold hover:underline underline-offset-2">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
