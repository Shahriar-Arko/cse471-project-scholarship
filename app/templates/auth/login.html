{% extends "base.html" %}

{% block title %}Login - ScholarMatch{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center animated-bg relative overflow-hidden px-4">

    <!-- Floating Orbs Background -->
    <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-2xl opacity-30 animate-blob animation-delay-4000"></div>

    <div class="relative w-full max-w-md animate-fade-in" x-data="{ role: 'student' }">
        <div class="glass-card rounded-2xl shadow-2xl p-8 relative overflow-hidden">

            <!-- Branding -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white/20 mb-4 shadow-inner">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white tracking-tight">ScholarMatch</h1>
                <p class="text-indigo-100 mt-2 text-sm">Your Gateway to Global Scholarships</p>
            </div>

            <!-- Login Form -->
            <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">

                <!-- Role selection hidden input -->
                <input type="hidden" name="role" :value="role">

                <!-- Role Toggle Switch (Updated to 3 Columns) -->
                <div class="flex p-1 bg-white/10 rounded-xl mb-6 relative">
                    <button type="button" @click="role = 'student'"
                        class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                        :class="role === 'student' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                        Student
                    </button>
                    <button type="button" @click="role = 'professor'"
                        class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                        :class="role === 'professor' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                        Professor
                    </button>
                    <button type="button" @click="role = 'evaluator'"
                        class="flex-1 py-2 text-xs font-medium rounded-lg transition-all z-10"
                        :class="role === 'evaluator' ? 'text-indigo-900 shadow-sm' : 'text-white hover:text-indigo-100'">
                        Evaluator
                    </button>
                    <!-- Sliding background pill -->
                    <div class="absolute top-1 bottom-1 w-[calc(33.33%-4px)] bg-white rounded-lg transition-all duration-300 ease-in-out"
                        :class="{
                            'left-1': role === 'student',
                            'left-[calc(33.33%+2px)]': role === 'professor',
                            'left-[calc(66.66%+2px)]': role === 'evaluator'
                        }"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-white/90 mb-1" for="email">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <input type="email" name="email" id="email" required class="block w-full pl-10 pr-3 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300" placeholder="you@example.com">
                    </div>
                </div>

                <div x-data="{ showPassword: false }">
                    <label class="block text-sm font-medium text-white/90 mb-1" for="password">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input :type="showPassword ? 'text' : 'password'" name="password" id="password" required class="block w-full pl-10 pr-10 py-2.5 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-200/60 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all duration-300" placeholder="••••••••">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <button type="button" @click="showPassword = !showPassword" class="text-indigo-200 hover:text-white transition-colors">
                                <svg x-show="!showPassword" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg x-show="showPassword" x-cloak class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.29 3.29m0 0a10.05 10.05 0 015.458-2.89m-5.458 2.89l-2.072-2.072"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-indigo-100 cursor-pointer hover:text-white transition-colors">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded border-white/20 bg-white/10 text-indigo-500 focus:ring-indigo-500/50">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-white hover:text-indigo-200 transition-colors underline-offset-2 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-white text-indigo-600 font-semibold rounded-xl shadow-lg hover:bg-indigo-50 hover:scale-[1.02] hover:shadow-xl transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-white/50">
                    Sign In
                </button>
            </form>

            <div class="mt-6 flex items-center justify-center text-sm text-indigo-100">
                <div class="w-full h-px bg-white/20"></div>
                <span class="px-4">or continue with</span>
                <div class="w-full h-px bg-white/20"></div>
            </div>

            <!-- Google Sign In Button -->
            <a :href="'{{ url_for('auth.google_login') }}?role=' + role"
                class="mt-6 w-full py-2.5 px-4 bg-white/10 border border-white/20 text-white font-medium rounded-xl hover:bg-white/20 transition-all duration-300 flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Sign in with Google
            </a>

            <p class="mt-8 text-center text-sm text-indigo-100">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}" class="text-white font-semibold hover:underline underline-offset-2">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
